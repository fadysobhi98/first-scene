<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — FS | First Scene</title>
<meta name="description" content="Photography by FS | First Scene: booths, conferences, brand and event work.">
<style>
:root { --bg:#0c0b0c; --panel:#141213; --ink:#f4f1ee; --muted:#a49e9a; --line:#2a2728; --accent:#c9a25e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
  a { color:inherit; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
  header { position:sticky; top:0; z-index:10; background:rgba(12,11,12,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  header .wrap { display:flex; justify-content:space-between; align-items:center; height:60px; }
  .brand { font-weight:700; letter-spacing:.14em; font-size:14px; }
  .brand span { color:var(--accent); }
  nav a { font-size:13px; color:var(--muted); text-decoration:none; margin-left:22px; letter-spacing:.06em; }
  nav a:hover { color:var(--ink); }
  .hero { position:relative; min-height:64vh; display:flex; align-items:flex-end; background-color:#141213; background-position:center 35%; background-size:cover; background-repeat:no-repeat; }
  .hero::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,11,12,.45), rgba(12,11,12,.92)); }
  .hero .wrap { position:relative; padding:90px 20px 64px; }
  .kicker { font-size:12px; letter-spacing:.28em; color:var(--accent); text-transform:uppercase; margin-bottom:14px; }
  h1 { font-size:clamp(38px,7vw,68px); font-weight:800; letter-spacing:-.01em; line-height:1.05; }
  .hero p { color:var(--muted); max-width:560px; margin-top:16px; font-size:16px; }
  section { padding:64px 0 8px; }
  .sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:22px; flex-wrap:wrap; }
  h2 { font-size:clamp(22px,3.4vw,30px); font-weight:700; }
  .tag { color:var(--muted); font-size:13px; letter-spacing:.12em; text-transform:uppercase; }
  .blurb { color:var(--muted); max-width:640px; margin-bottom:20px; font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .grid img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; display:block; background:var(--panel); }
  .covers { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-top:12px; }
  .cover { position:relative; display:block; border-radius:12px; overflow:hidden; text-decoration:none; background:var(--panel); }
  .cover img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; transition:transform .35s ease; }
  .cover:hover img { transform:scale(1.03); }
  .cover .badge { position:absolute; left:12px; bottom:12px; display:inline-flex; align-items:center; gap:8px; background:rgba(10,9,10,.78); border:1px solid rgba(255,255,255,.14); padding:8px 14px; border-radius:999px; font-size:13px; }
  .cover .badge .tri { color:var(--accent); font-size:11px; }
  .cover .name { position:absolute; top:12px; left:12px; background:rgba(10,9,10,.66); padding:5px 11px; border-radius:999px; font-size:12px; letter-spacing:.04em; }
  .album { display:inline-block; margin-top:16px; font-size:14px; color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; }
  .album:hover { border-color:var(--accent); }
  footer { margin-top:80px; border-top:1px solid var(--line); padding:48px 0 60px; }
  .cta { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:999px; text-decoration:none; font-size:14px; font-weight:600; }
  .btn-primary { background:var(--ink); color:#141213; }
  .btn-ghost { border:1px solid var(--line); color:var(--ink); }
  .fine { color:var(--muted); font-size:12.5px; margin-top:34px; }
  .group-title { grid-column:1/-1; margin:26px 0 2px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted,#9a939c); }
  .group-title span { color:var(--accent); }
  @media (max-width:700px) { .grid { grid-template-columns:repeat(3,1fr); gap:8px; } }

  nav a.current { color:var(--ink); border-bottom:2px solid var(--accent); padding-bottom:3px; }
  .page-head { padding:72px 0 8px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">FS <span>|</span> FIRST SCENE</div>
    <nav>
      <a href="index.html">Work</a>

  <div class="grid">
    <img data-i="interreg-1" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="interreg-2" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="interreg-3" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="interreg-4" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="gb-1" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="gb-2" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="gb-3" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="gb-4" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="egypes-1" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="egypes-2" alt="FS First Scene event and commercial photography" loading="lazy">

    <img data-i="egypes-4" alt="FS First Scene event and commercial photography" loading="lazy">
    <img data-i="mnt-1" alt="FS First Scene event and commercial photography" loading="lazy">

    <img data-i="mnt-5" alt="FS First Scene event and commercial photography" loading="lazy">

</section>

<footer id="contact">
  <div class="wrap">
    <div class="kicker">Bookings and inquiries</div>
    <h2>Work with us</h2>
    <div class="cta">
      <a class="btn btn-primary" href="https://wa.me/201275314549" target="_blank" rel="noreferrer">WhatsApp · 0127 531 4549</a>
      <a class="btn btn-ghost" href="https://www.instagram.com/fs.first_scene" target="_blank" rel="noreferrer">Instagram · @fs.first_scene</a>
    </div>
    <p class="fine">FS | First Scene — Event &amp; Commercial Photo/Video · Egypt | KSA. Albums and films are view-only Google Drive links.</p>
  </div>

<script>
  (function(){
    var host = document.getElementById('all-photos');
    if (!host || !window.FSPHOTOS) return;
    var frag = document.createDocumentFragment();
    window.FSPHOTOS.forEach(function(g){
      var t = document.createElement('div');
      t.className = 'group-title';
      t.innerHTML = g.label + ' <span>&middot; ' + g.ids.length + '</span>';
      frag.appendChild(t);
      g.ids.forEach(function(id){
        var im = document.createElement('img');
        im.loading = 'lazy'; im.decoding = 'async';
        im.alt = g.label + ' - FS First Scene photography';
        im.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w600';
        frag.appendChild(im);
      });
    });
    host.appendChild(frag);
  })();
  document.querySelectorAll('img[data-i]').forEach(function(el){ var v=window.FSIMGS&&window.FSIMGS[el.dataset.i]; if(v) el.src=v; });
</script>
</body>
</html>
